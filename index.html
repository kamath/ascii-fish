<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="description" content="An animated ascii fish">
  <link rel="canonical" href="https://ascii-fish.dev/">
  <meta property="og:type" content="website">

  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; min-height: 100dvh; margin: 0; overflow: hidden; background: #080d10; color-scheme: dark; }
    #art {
      position: fixed; inset: 0; margin: 0; overflow: hidden;
      height: 100%; height: 100dvh;
      contain: strict;
      -webkit-text-size-adjust: none;
    }
    #art div { position: absolute; left: 0; width: 100%; white-space: pre; contain: strict; }
    /* Every glyph sits in a box exactly one cell wide, so proportional type
       stays on the grid while the characters remain real, selectable text. */
    #art b { display: inline-block; font-weight: 400; text-align: center; }
    #art b[hidden] { display: none; }
    #art ::selection { color: #fff1cf; background: rgba(232, 218, 181, 0.22); }
    footer {
      z-index: 1;
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(15px, env(safe-area-inset-bottom));
      color: #8c9696;
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover, footer a:focus-visible { color: #e8dab5; text-decoration: underline; text-underline-offset: 3px; }
    @media (max-width: 600px) {
      footer { font-size: 10px; }
    }
  </style>
</head>
<body>
  <pre id="art" role="img" aria-label="A gold-and-silver fish made of a passage from The Little Prince by Antoine de Saint-Exupéry swims through the dark."></pre>
  <footer>Made with &lt;3 by <a href="https://kamath.io" target="_blank" rel="noopener noreferrer">Anirudh Kamath</a></footer>
  <script>
  (() => {
    'use strict';

    // The visible fish is selectable text. An offscreen light field controls
    // its shape and shading; the characters themselves retain their word order.
    const art = document.getElementById('art');
    const sheet = document.head.appendChild(document.createElement('style'));
    const field = document.createElement('canvas');
    const ink = field.getContext('2d', { willReadFrequently: true });
    const probe = document.createElement('canvas');
    probe.width = probe.height = 1;
    const measure = probe.getContext('2d', { willReadFrequently: true });
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    const TAU = Math.PI * 2;
    const FAMILY = 'Georgia, "Times New Roman", serif';
    // User-provided passage from The Little Prince. Paragraphs flow through
    // the silhouette; preserve the original wording and punctuation.
    const PASSAGE = `“Goodbye,” said the fox. “And now here is my secret, a very simple secret: It is only with the heart that one can see rightly; what is essential is invisible to the eye.”

“What is essential is invisible to the eye,” the little prince repeated, so that he would be sure to remember.

“It is the time you have wasted for your rose that makes your rose so important.”

“It is the time I have wasted for my rose — ” said the little prince, so that he would be sure to remember.

“Men have forgotten this truth,” said the fox. “But you must not forget it. You become responsible, forever, for what you have tamed. You are responsible for your rose…”

“I am responsible for my rose,” the little prince repeated, so that he would be sure to remember.`.replace(/\s+/g, ' ').trim() + ' ';
    // Cache each distinct character once, regardless of the passage length.
    const CHARACTERS = [...new Set(PASSAGE)];
    const LETTERS = Array.from(PASSAGE, char => CHARACTERS.indexOf(char));
    const TINTS = ['104,156,164', '147,183,179', '190,206,190', '218,209,173', '232,194,134', '239,222,184'];
    const SHADES = 24;
    const CELLS = 14000;
    let width, height, fontSize, cellW, cellH, cols, rows;
    let cells = [], gaps = [], lines = [], frame = 0, last = 0, time = 0;
    let lastPaint = 0;
    let scale, centerX, centerY, angle, yaw, pitch, depth, positionX, positionY;
    let cy, sy, cp, sp, cr, sr;
    let scene = [];
    const focalLength = 1800;
    const orbitDuration = 48;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const mix = (a, b, t) => a + (b - a) * t;
    const pointer = { x: 0, y: 0, smoothX: 0, smoothY: 0, engaged: false, seen: false };
    let grabbed = false;
    const tilt = { listening: false, pending: false, permission: 'unknown', neutral: null, strength: 0 };
    const pilot = {
      active: false, influence: 0, position: [0, 0, 0],
      yaw: 0, pitch: 0, yawRate: TAU / orbitDuration, pitchRate: 0
    };

    const faces = [400, 600, 800].map(weight => ({ weight, style: 'normal' }));

    // Static classes and glyph descriptors are shared by every frame. Each grid
    // row reuses a small pool of elements; empty water is one space run.
    function buildMarkup() {
      const rules = [`#art{font:${fontSize}px/${cellH}px ${FAMILY}}`,
        `#art div,#art b{height:${cellH}px}`, `#art b{width:${cellW}px}`];
      for (let face = 0; face < faces.length; face++) {
        for (let tint = 0; tint < TINTS.length; tint++) {
          for (let shade = 0; shade < SHADES; shade++) {
            rules.push(`#art b.k${(face * TINTS.length + tint) * SHADES + shade}` +
              `{font-weight:${faces[face].weight};font-style:${faces[face].style};` +
              `color:rgba(${TINTS[tint]},${(shade + 1) / SHADES})}`);
          }
        }
      }
      measure.font = `normal 400 ${fontSize}px ${FAMILY}`;
      const spacing = cellW - measure.measureText(' ').width;
      gaps = Array.from({ length: cols + 1 }, (_, run) => {
        rules.push(`#art b.g${run}{width:${run * cellW}px;letter-spacing:${spacing}px}`);
        return { char: ' '.repeat(run), className: `g${run}` };
      });
      sheet.textContent = rules.join('');
      cells = new Array(CHARACTERS.length * faces.length * TINTS.length * SHADES);
      for (let letter = 0; letter < CHARACTERS.length; letter++) {
        for (let face = 0; face < faces.length; face++) {
          for (let tint = 0; tint < TINTS.length; tint++) {
            for (let shade = 0; shade < SHADES; shade++) {
              const style = (face * TINTS.length + tint) * SHADES + shade;
              cells[letter * faces.length * TINTS.length * SHADES + style] = {
                char: CHARACTERS[letter], className: `ink k${style}`
              };
            }
          }
        }
      }
    }

    function buildLines() {
      const fragment = document.createDocumentFragment();
      lines = Array.from({ length: rows }, (_, row) => {
        const line = document.createElement('div');
        line.style.top = `${row * cellH}px`;
        const newline = document.createTextNode('\n');
        line.appendChild(newline);
        fragment.appendChild(line);
        return { node: line, newline, slots: [], used: 0 };
      });
      art.replaceChildren(fragment);
    }

    function writeCell(line, index, key, glyph) {
      let slot = line.slots[index];
      if (!slot) {
        const node = document.createElement('b');
        const text = document.createTextNode('');
        node.appendChild(text);
        line.node.insertBefore(node, line.newline);
        slot = line.slots[index] = { node, text, key: null, char: '', className: '' };
      }
      if (index >= line.used) slot.node.hidden = false;
      if (slot.key === key) return;
      if (slot.char !== glyph.char) slot.text.data = slot.char = glyph.char;
      if (slot.className !== glyph.className) slot.node.className = slot.className = glyph.className;
      slot.key = key;
    }

    function resize() {
      width = innerWidth;
      height = innerHeight;
      // Real glyphs cost style, layout and paint, so the grid answers to a
      // cell budget rather than to the display: a larger screen is given
      // larger type instead of more boxes to lay out on every frame.
      fontSize = Math.max(7, width / 165, Math.sqrt(width * height / (0.66 * 1.02 * CELLS)));
      // Layout engines keep lengths in 1/64 of a pixel. Cells that land on
      // that grid exactly cannot accumulate rounding error across a row.
      cellW = Math.round(fontSize * 0.66 * 64) / 64;
      cellH = Math.round(fontSize * 1.02 * 64) / 64;
      cols = Math.ceil(width / cellW);
      rows = Math.ceil(height / cellH);
      field.width = cols * 3;
      field.height = rows * 3;
      buildMarkup();
      buildLines();
      fitCourse();
      draw();
    }

    // Model coordinates are 3D; the camera looks down the negative Z axis.
    function rotate(x, y, z) {
      const pitchedX = x * cp - y * sp;
      const pitchedY = x * sp + y * cp;
      const turnedX = pitchedX * cy + z * sy;
      const turnedZ = -pitchedX * sy + z * cy;
      return [turnedX * cr - pitchedY * sr, turnedX * sr + pitchedY * cr, turnedZ];
    }

    function point(x, y, fin = 0, looseness = 0, z = 0) {
      const rear = clamp((415 - x) / 950, 0, 1);
      const phase = time * 1.85 - rear * 5.1;
      const px = x + Math.sin(phase + y * 0.009) * rear * rear * 9;
      const py = y + Math.sin(phase) * (2 + 12 * rear * rear)
        + fin * looseness * Math.sin(phase - looseness * 3.2 + x * 0.008) * 12;
      const pz = z + Math.sin(phase) * (4 + 49 * rear * rear)
        + fin * looseness * Math.sin(phase - looseness * 3.7 + y * 0.012) * 27;
      const rotated = rotate(px, py, pz);
      const cameraZ = rotated[2] + depth;
      const perspective = focalLength / (focalLength - cameraZ);
      return [centerX + (rotated[0] + positionX) * scale * perspective,
              centerY + (rotated[1] + positionY) * scale * perspective, cameraZ, perspective];
    }

    function shape(points, fill, color = null, lineWidth = 1, closed = true) {
      projectedShape(points.map(p => point(...p)), fill, color, lineWidth, closed);
    }

    function projectedShape(vertices, fill, color = null, lineWidth = 1, closed = true) {
      let z = 0, perspective = 0;
      for (const p of vertices) { z += p[2]; perspective += p[3]; }
      scene.push({ vertices, fill, color, closed,
        z: z / vertices.length,
        lineWidth: lineWidth * scale * perspective / vertices.length });
    }

    function stroke(points, color, lineWidth = 1) {
      shape(points, null, color, lineWidth, false);
    }

    function paintScene() {
      // Sorting small patches lets the far eye and fins disappear behind
      // the body as it turns, while the near surfaces remain in front.
      scene.sort((a, b) => a.z - b.z);
      ink.lineJoin = 'round';
      ink.lineCap = 'round';
      for (const part of scene) {
        ink.beginPath();
        for (let i = 0; i < part.vertices.length; i++) {
          const p = part.vertices[i];
          if (i === 0) ink.moveTo(p[0], p[1]); else ink.lineTo(p[0], p[1]);
        }
        if (part.closed) ink.closePath();
        if (part.fill) { ink.fillStyle = part.fill; ink.fill(); }
        if (part.color) {
          ink.strokeStyle = part.color;
          ink.lineWidth = part.lineWidth;
          ink.stroke();
        }
      }
    }

    function fin(surface, count, warmth = 0) {
      const membrane = surface;
      surface = (u, v) => membrane(clamp(u, 0, 1), v);
      const steps = 6;
      // Adjacent membrane patches share vertices. Project each one once.
      const mesh = Array.from({ length: count + 1 }, (_, ray) =>
        Array.from({ length: steps + 1 }, (_, step) => point(...surface(ray / count, step / steps))));
      for (let ray = 0; ray < count; ray++) {
        const u = ray / count;
        const light = 0.5 + 0.5 * Math.sin(u * 63 + Math.sin(time * 1.85 - u * 8) * 1.1);
        const shade = 13 + light * 24;
        const fill = `rgb(${shade + warmth * 25},${shade + 15},${shade + 18 - warmth * 12})`;
        for (let j = 0; j < steps; j++) {
          projectedShape([mesh[ray][j], mesh[ray + 1][j], mesh[ray + 1][j + 1], mesh[ray][j + 1]], fill, fill, 0.45);
        }
      }
      for (let ray = 0; ray <= count; ray++) {
        const u = ray / count;
        const light = 0.5 + 0.5 * Math.sin(u * 27 + 0.5);
        const color = `rgba(${180 + warmth * 50},${200 + warmth * 12},${198 - warmth * 35},${0.55 + light * 0.4})`;
        for (let segment = 0; segment < 2; segment++) {
          const points = [];
          for (let j = 0; j <= 6; j++) points.push(surface(u, (segment + j / 6) / 2));
          stroke(points, color, ray % 3 === 0 ? 3.2 : 2.1);
        }
        if (ray % 2 === 0) {
          const branch = [];
          for (let j = 0; j <= 12; j++) {
            const v = 0.56 + j / 12 * 0.44;
            branch.push(surface(u + (v - 0.56) * 0.016, v));
          }
          stroke(branch, 'rgba(185,205,190,0.44)', 0.8);
        }
        if (ray < count) {
          const rim = [];
          for (let j = 0; j <= 3; j++) rim.push(surface((ray + j / 3) / count, 1));
          stroke(rim, 'rgba(198,210,183,0.55)', 1.15);
        }
      }
    }

    function tail(u, v) {
      const theta = mix(-1.17, 1.17, u);
      const scallop = Math.sin(u * Math.PI * 18) * 7 + Math.sin(u * 37 + time * 1.75) * 9;
      const edgeX = -150 - (375 + scallop) * Math.cos(theta);
      const edgeY = (322 + scallop) * Math.sin(theta);
      return [mix(-113, edgeX, v), mix((u - 0.5) * 59, edgeY, v) + Math.sin(v * Math.PI) * Math.sin(u * 8 + time * 1.75) * 18, 1, v];
    }

    function dorsal(u, v) {
      const rootX = mix(-120, 280, u);
      const rootY = -bodyRadius(rootX) * 0.85;
      const spread = Math.pow(Math.sin(Math.PI * u), 0.8);
      return [rootX - v * (70 + 58 * spread), rootY - v * (12 + 164 * spread) + Math.sin(u * 42) * v * 4, 1, v];
    }

    function anal(u, v) {
      const rootX = mix(-117, 259, u);
      const rootY = bodyRadius(rootX) * 0.77;
      const spread = Math.pow(Math.sin(Math.PI * u), 0.65);
      return [rootX - v * (94 + 37 * spread), rootY + v * (10 + 173 * spread) + Math.sin(u * 48) * v * 4, 1, v];
    }

    function bodyRadius(x) {
      const u = clamp((x + 135) / 571, 0, 1);
      const radius = 16 + 120 * Math.pow(Math.sin(Math.PI * u), 0.88) * (0.65 + u * 0.48);
      return radius * (1 - clamp((x - 436) / 16, 0, 1));
    }

    function skin(x, phi, lift = 0) {
      const radius = bodyRadius(x);
      const top = Math.sin(phi) < 0 && x > 290 ? mix(1, 0.55, clamp((x - 290) / 146, 0, 1)) : 1;
      return [x, Math.sin(phi) * (radius + lift) * top, 0, 0,
        Math.cos(phi) * (radius * 0.63 + lift)];
    }

    function flank(x, y, side, lift = 2) {
      const radius = bodyRadius(x);
      const top = y < 0 && x > 290 ? mix(1, 0.55, clamp((x - 290) / 146, 0, 1)) : 1;
      const z = Math.sqrt(Math.max(0, 1 - (y / Math.max(1, radius * top)) ** 2)) * radius * 0.63;
      return [x, y, 0, 0, side * (z + lift)];
    }

    function body() {
      const rings = 30, segments = 24;
      for (let i = 0; i < rings; i++) {
        const x = mix(-135, 452, i / rings), nextX = mix(-135, 452, (i + 1) / rings);
        for (let j = 0; j < segments; j++) {
          const phi = j / segments * TAU, endPhi = (j + 1) / segments * TAU;
          const mid = (phi + endPhi) / 2;
          const slope = (bodyRadius(x + 1) - bodyRadius(x - 1)) / 2;
          const n = rotate(-slope * 0.63, Math.sin(mid) * 0.63, Math.cos(mid));
          const length = Math.hypot(...n);
          // Omit the hidden half of the body; retain a rim at the silhouette
          // to allow for the small normal changes caused by its swimming bend.
          const surface = skin((x + nextX) / 2, mid);
          const position = rotate(surface[0], surface[1], surface[4]);
          const view = [-position[0] - positionX, -position[1] - positionY, focalLength - depth - position[2]];
          if ((n[0] * view[0] + n[1] * view[1] + n[2] * view[2]) / (length * Math.hypot(...view)) < -0.12) continue;
          const diffuse = Math.max(0, (-n[0] * 0.28 - n[1] * 0.62 + n[2] * 0.73) / length);
          const sheen = Math.pow(Math.max(0, (-n[1] * 0.30 + n[2] * 0.95) / length), 12);
          const light = 0.40 + diffuse * 0.59 + sheen * 0.23;
          const belly = Math.max(0, Math.sin(mid));
          const fleck = 0.96 + Math.sin(i * 5.17 + j * 3.31) * 0.04;
          const color = `rgb(${Math.min(255, (224 - belly * 52) * light * fleck)},${Math.min(255, (203 - belly * 29) * light * fleck)},${Math.min(255, (150 + belly * 3) * light * fleck)})`;
          shape([skin(x, phi), skin(nextX, phi), skin(nextX, endPhi), skin(x, endPhi)], color, color, 0.65);
          if (i < rings - 3) {
            const curve = [], highlight = [];
            for (let k = 0; k <= 6; k++) {
              const t = k / 6;
              const scaleX = x + (nextX - x) * (0.36 + Math.sin(t * Math.PI) * 0.60);
              curve.push(skin(scaleX, mix(phi, endPhi, t), 1.3));
              highlight.push(skin(scaleX - 2, mix(phi, endPhi, t) - 0.008, 1.5));
            }
            stroke(curve, 'rgba(30,47,40,0.72)', 2.2);
            stroke(highlight, 'rgba(255,239,186,0.40)', 1.2);
          }
        }
      }
      for (const side of [-1, 1]) {
        const gill = [];
        for (let i = 0; i <= 32; i++) {
          const t = i / 32;
          gill.push(flank(291 + 37 * Math.sin(t * Math.PI), -93 + t * 194, side));
        }
        stroke(gill, 'rgba(40,60,51,0.92)', 4.5);
        stroke(gill.map(p => flank(p[0] - 6, p[1], side)), 'rgba(236,214,160,0.85)', 2.7);
        const eye = (x, y, radius, color, lift) => {
          const points = [];
          for (let i = 0; i < 32; i++) points.push(flank(x + Math.cos(i / 32 * TAU) * radius, y + Math.sin(i / 32 * TAU) * radius, side, lift));
          shape(points, color);
        };
        eye(375, -31, 15, '#ede4b7', 3);
        eye(376, -31, 9.2, '#101b1d', 4);
        eye(378.5, -35, 2.5, '#fff2cd', 5);
        stroke([[443, 6], [426, 9], [416, 6]].map(p => flank(...p, side, 3)), '#344a43', 3);
      }
    }

    function pectoral(u, v, side) {
      const flutter = Math.sin(time * 2.3 - 0.7) * 0.17;
      const a = mix(1.55, 2.94, u) + flutter;
      const length = 148 + 38 * Math.sin(u * Math.PI);
      return [265 + Math.cos(a) * length * v, 42 + Math.sin(a) * length * v,
        1, v, side * (65 + Math.sin(v * 1.8) * (65 + Math.sin(time * 2.3) * 25))];
    }

    function course() {
      // A broad, continuous orbit in world space. Its tangent sets the
      // heading, so the nose leads every turn and the tail follows through.
      const phase = time * TAU / orbitDuration;
      const portrait = clamp((1 - width / height) * 2, 0, 1);
      const baseAngle = -0.10 - portrait * 1.47;
      const x = Math.sin(phase) * 360;
      const y = Math.sin(phase) * 65 + Math.sin(phase * 2) * 20;
      const z = Math.cos(phase) * 360;
      const vx = Math.cos(phase) * 360;
      const vy = Math.cos(phase) * 65 + Math.cos(phase * 2) * 40;
      const vz = -Math.sin(phase) * 360;
      return { phase, baseAngle, position: [x, y, z],
        velocity: [vx, vy, vz].map(v => v * TAU / orbitDuration),
        yaw: Math.atan2(-vz, vx), pitch: Math.atan2(vy, Math.hypot(vx, vz)) };
    }

    function updatePilot(dt) {
      if (!pilot.active || dt <= 0) return;
      const route = course();
      // Keep a stationary cursor as the target until it leaves the page.
      // Expiring the target after every mouse movement made the fish repeatedly
      // chase the cursor, then turn back toward its still-moving orbit.
      const engaged = pointer.engaged;
      pilot.influence += ((engaged ? 1 : 0) - pilot.influence) * (1 - Math.exp(-dt / 0.85));
      const smoothing = 1 - Math.exp(-dt / 0.55);
      pointer.smoothX += (pointer.x - pointer.smoothX) * smoothing;
      pointer.smoothY += (pointer.y - pointer.smoothY) * smoothing;

      // Unproject into a plane inside the water, then gently compress targets
      // near the screen edges. This guides the fish without moving the camera.
      const targetZ = 160;
      const unproject = (focalLength - targetZ) / (focalLength * scale);
      const sx = pointer.smoothX * width * 0.5 * unproject;
      const sy = pointer.smoothY * height * 0.5 * unproject;
      const c = Math.cos(route.baseAngle), s = Math.sin(route.baseAngle);
      const target = [360 * Math.tanh((sx * c + sy * s) / 420),
        130 * Math.tanh((-sx * s + sy * c) / 240), targetZ];
      const destination = engaged ? target : route.position;
      const displacement = destination.map((v, i) => v - pilot.position[i]);
      const distance = Math.hypot(...displacement);
      // Exponential arrival cannot overshoot a stationary target. Limit speed
      // without a spring or stored momentum that can reverse the heading.
      const travel = Math.min(1 - Math.exp(-dt * 1.15), 140 * dt / Math.max(distance, 0.001));
      for (let i = 0; i < 3; i++) pilot.position[i] += displacement[i] * travel;

      // Near arrival the direction of tiny corrections is unstable. Hold the
      // last heading there, and turn with a bounded first-order response outside.
      const speed = distance * travel / dt;
      if (speed > 8) {
        const desiredYaw = Math.atan2(-displacement[2], displacement[0]);
        const desiredPitch = clamp(Math.atan2(displacement[1], Math.hypot(displacement[0], displacement[2])), -0.50, 0.50);
        const yawError = Math.atan2(Math.sin(desiredYaw - pilot.yaw), Math.cos(desiredYaw - pilot.yaw));
        const turn = 1 - Math.exp(-dt * 2.2);
        const yawStep = clamp(yawError * turn, -0.65 * dt, 0.65 * dt);
        const pitchStep = clamp((desiredPitch - pilot.pitch) * turn, -0.38 * dt, 0.38 * dt);
        pilot.yaw += yawStep;
        pilot.pitch += pitchStep;
        pilot.yawRate = yawStep / dt;
        pilot.pitchRate = pitchStep / dt;
      } else {
        pilot.yawRate *= Math.exp(-dt * 3);
        pilot.pitchRate *= Math.exp(-dt * 3);
      }
    }

    function swim(interactive = true) {
      const route = course();
      const steering = interactive && pilot.active;
      const [x, y, z] = steering ? pilot.position : route.position;
      const { baseAngle, phase } = route;
      positionX = x * Math.cos(baseAngle) - y * Math.sin(baseAngle);
      positionY = x * Math.sin(baseAngle) + y * Math.cos(baseAngle);
      depth = z;
      yaw = steering ? pilot.yaw : route.yaw;
      pitch = steering ? pilot.pitch : route.pitch;
      angle = baseAngle + Math.sin(phase) * 0.055;
      if (steering) angle -= pilot.yawRate * pilot.influence * 0.10;
      cy = Math.cos(yaw); sy = Math.sin(yaw);
      cp = Math.cos(pitch); sp = Math.sin(pitch);
      cr = Math.cos(angle); sr = Math.sin(angle);
    }

    function fitCourse() {
      // Frame the ENTIRE orbit once per resize. The camera never reacts to
      // an individual fin or an approaching edge during the animation.
      const savedTime = time;
      scale = 1;
      centerX = centerY = 0;
      let extentX = 0, extentY = 0;
      const include = p => {
        const projected = point(...p);
        extentX = Math.max(extentX, Math.abs(projected[0]));
        extentY = Math.max(extentY, Math.abs(projected[1]));
      };
      for (let step = 0; step <= 96; step++) {
        time = step / 96 * orbitDuration;
        swim(false);
        for (let i = 0; i <= 20; i++) {
          const u = i / 20;
          for (let j = 0; j <= 4; j++) {
            const v = j / 4;
            include(tail(u, v)); include(dorsal(u, v)); include(anal(u, v));
            include(pectoral(u, v, -1)); include(pectoral(u, v, 1));
          }
          for (let j = 0; j < 16; j++) include(skin(mix(-135, 452, u), j / 16 * TAU));
          for (const side of [-1, 1]) {
            include([255 - u * 185, 97 + Math.sin(u * 1.65) * 172, 1, u, side * (22 + u * 15)]);
          }
        }
      }
      scale = Math.min(width * 0.43 / extentX, height * 0.42 / extentY);
      centerX = width * 0.5;
      centerY = height * 0.5;
      time = savedTime;
    }

    function drawField() {
      ink.setTransform(1, 0, 0, 1, 0, 0);
      ink.fillStyle = '#000';
      ink.fillRect(0, 0, field.width, field.height);
      ink.setTransform(3 / cellW, 0, 0, 3 / cellH, 0, 0);
      swim();
      scene = [];
      fin(tail, 46, 0.25);
      fin(dorsal, 35, 0.4);
      fin(anal, 38, 0.25);
      body();
      for (const side of [-1, 1]) {
        for (let f = 0; f < 2; f++) {
          const filament = [];
          for (let i = 0; i <= 40; i++) {
            const t = i / 40;
            filament.push([255 - t * (163 + f * 22), 97 + Math.sin(t * 1.65) * (148 + f * 24), 1, t, side * (22 + t * 15)]);
          }
          stroke(filament, f ? '#8caaa0' : '#d5c693', f ? 1.7 : 2.6);
        }
        fin((u, v) => pectoral(u, v, side), 24, 0.6);
      }
      paintScene();
    }

    function draw() {
      drawField();
      const pixels = ink.getImageData(0, 0, field.width, field.height).data;
      let letter = 0;
      for (let row = 0; row < rows; row++) {
        const line = lines[row];
        let used = 0, gap = 0;
        for (let col = 0; col < cols; col++) {
          // Supersampling preserves the fine fin rays between glyph centers.
          let r = 0, g = 0, b = 0;
          for (let sy = 0; sy < 3; sy++) {
            let offset = ((row * 3 + sy) * field.width + col * 3) * 4;
            for (let sx = 0; sx < 3; sx++, offset += 4) {
              r += pixels[offset]; g += pixels[offset + 1]; b += pixels[offset + 2];
            }
          }
          r /= 9; g /= 9; b /= 9;
          const brightness = (r * 0.25 + g * 0.60 + b * 0.15) / 255;
          if (brightness < 0.022) { gap++; continue; }
          const face = brightness > 0.55 ? 2 : brightness > 0.20 ? 1 : 0;
          let tint = r > g * 1.15 ? 4 : r > b * 1.22 ? 3 : g > r * 1.12 ? 0 : 2;
          if (brightness > 0.74) tint = 5;
          if (tint === 0 && brightness > 0.37) tint = 1;
          const opacity = clamp(0.48 + brightness * 0.85, 0, 1) * Math.min(1, brightness / 0.075);
          const shade = clamp(Math.ceil(opacity * SHADES) - 1, 0, SHADES - 1);
          // Advance through the passage only inside the silhouette. Its words
          // read left to right, continuing across rows and repeating as needed.
          const key = ((LETTERS[letter] * faces.length + face) * TINTS.length + tint) * SHADES + shade;
          letter = (letter + 1) % LETTERS.length;
          if (gap) { writeCell(line, used++, -gap, gaps[gap]); gap = 0; }
          writeCell(line, used++, key, cells[key]);
        }
        for (let i = used; i < line.used; i++) {
          const slot = line.slots[i];
          slot.node.hidden = true;
          slot.text.data = slot.char = '';
          slot.key = null;
        }
        line.used = used;
      }
    }

    // Hold the picture while selecting its characters so copying is stable.
    function still() {
      if (grabbed) return true;
      const selection = getSelection();
      return !!selection && !selection.isCollapsed &&
        (art.contains(selection.anchorNode) || art.contains(selection.focusNode));
    }

    function animate(now) {
      if (!last) last = now;
      const delta = Math.min((now - last) / 1000, 0.05);
      last = now;
      if (!motion.matches && !still()) {
        time += delta;
        updatePilot(delta);
        // Keep steering at display cadence, but avoid drawing 120+ times per
        // second on high-refresh desktops. Preserve the cadence remainder.
        const elapsed = now - lastPaint;
        if (elapsed >= 1000 / 60 - 0.5) {
          draw();
          lastPaint = now - Math.max(0, (elapsed + 0.5) % (1000 / 60) - 0.5);
        }
      }
      frame = requestAnimationFrame(animate);
    }
    function guideTo(x, y) {
      pointer.x = x; pointer.y = y;
      pointer.engaged = true;
      if (!pointer.seen) {
        pointer.smoothX = x; pointer.smoothY = y;
        pointer.seen = true;
      }
      if (!pilot.active) {
        const route = course();
        pilot.position = route.position.slice();
        pilot.yaw = route.yaw; pilot.pitch = route.pitch;
        pilot.active = true;
      }
    }

    art.addEventListener('pointerdown', event => { grabbed = event.pointerType !== 'touch'; }, { passive: true });
    for (const event of ['pointerup', 'pointercancel']) {
      addEventListener(event, () => { grabbed = false; }, { passive: true });
    }

    addEventListener('pointermove', event => {
      if (event.pointerType === 'touch' || motion.matches || grabbed) return;
      const x = clamp(event.clientX / width * 2 - 1, -1, 1);
      const y = clamp(event.clientY / height * 2 - 1, -1, 1);
      if (pointer.seen && Math.hypot((x - pointer.x) * width / 2, (y - pointer.y) * height / 2) < 1.5) return;
      tilt.strength = 0;
      guideTo(x, y);
    }, { passive: true });

    function orientPhone(event) {
      if (motion.matches || document.hidden || !Number.isFinite(event.beta) || !Number.isFinite(event.gamma)) return;
      if (!tilt.neutral) {
        tilt.neutral = { beta: event.beta, gamma: event.gamma };
        return;
      }
      const difference = (value, origin) => ((value - origin + 540) % 360) - 180;
      const beta = difference(event.beta, tilt.neutral.beta);
      const gamma = difference(event.gamma, tilt.neutral.gamma);
      const rotation = (screen.orientation?.angle ?? window.orientation ?? 0) * Math.PI / 180;
      // Sensor axes belong to the device. Rotate into the visible screen so
      // tilting right still steers right when the phone is held sideways.
      const x = gamma * Math.cos(rotation) + beta * Math.sin(rotation);
      const y = beta * Math.cos(rotation) - gamma * Math.sin(rotation);
      const deadZone = value => Math.sign(value) * clamp((Math.abs(value) - 2.5) / 22, 0, 1);
      const targetX = deadZone(x), targetY = deadZone(y);
      const strength = clamp(Math.hypot(targetX, targetY) * 1.5, 0, 1);
      if (strength > 0) {
        tilt.strength = strength;
        guideTo(targetX, targetY);
      } else if (tilt.strength > 0) {
        tilt.strength = 0;
        pointer.engaged = false;
      }
    }

    function listenForTilt() {
      if (tilt.listening) return;
      addEventListener('deviceorientation', orientPhone, { passive: true });
      tilt.listening = true;
      tilt.permission = 'granted';
    }

    const releasePointer = () => {
      pointer.engaged = false;
      grabbed = false;
      tilt.strength = 0;
      tilt.neutral = null;
    };

    async function enableTilt() {
      const sensor = window.DeviceOrientationEvent;
      if (!matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints === 0) return;
      if (!sensor || !isSecureContext || motion.matches || tilt.pending || tilt.permission === 'denied') return;
      releasePointer();
      if (tilt.listening) return; // A later tap recalibrates the resting pose.
      if (typeof sensor.requestPermission !== 'function') {
        listenForTilt();
        return;
      }
      // Safari requires permission to be requested directly from a user tap.
      tilt.pending = true;
      try {
        tilt.permission = await sensor.requestPermission();
        if (tilt.permission === 'granted') listenForTilt();
      } catch {
        // The autonomous fish remains available if motion access is blocked.
        tilt.permission = 'unknown';
      } finally {
        tilt.pending = false;
      }
    }

    art.addEventListener('click', enableTilt);
    screen.orientation?.addEventListener('change', releasePointer);
    addEventListener('orientationchange', releasePointer);
    if (window.DeviceOrientationEvent && isSecureContext &&
        typeof DeviceOrientationEvent.requestPermission !== 'function' &&
        (matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0)) listenForTilt();
    document.documentElement.addEventListener('pointerleave', releasePointer);
    addEventListener('blur', releasePointer);
    let resizeTimer;
    addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });
    document.addEventListener('visibilitychange', () => {
      cancelAnimationFrame(frame);
      last = 0;
      if (document.hidden) releasePointer();
      if (!document.hidden) frame = requestAnimationFrame(animate);
    });
    motion.addEventListener('change', () => { releasePointer(); draw(); });
    resize();
    frame = requestAnimationFrame(animate);
  })();
  </script>
</body>
</html>
